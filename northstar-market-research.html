<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Market Research Tool — Northstar AI Automation</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"><\/script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #0038FF;
    --navy: #0A0F2C;
    --cyan: #00C2FF;
    --blue-dim: #dde6ff;
    --cyan-dim: #d9f5ff;
    --green-dim: #e4f5e9;
    --amber-dim: #fff4df;
    --bg: #f0f2f7;
    --surface: #ffffff;
    --border: #e2e4ea;
    --text: #0A0F2C;
    --muted: #6b7280;
    --success: #16a34a;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem 5rem;
    font-size: 17px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  /* Header */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .brand-logo { height: 90px; width: auto; display: block; }

  .api-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
  }
  .api-pill input {
    border: none; outline: none;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    width: 220px;
    background: transparent;
  }
  .api-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #d1d5db; flex-shrink: 0; transition: background .3s;
  }
  .api-dot.active { background: var(--success); }

  /* Hero */
  .hero {
    background: var(--navy);
    border-radius: 18px;
    padding: 2.5rem;
    margin-bottom: 1.5rem;
  }
  .hero h1 {
    font-size: 30px; font-weight: 700;
    color: #fff; margin-bottom: 8px;
  }
  .hero p {
    font-size: 16px; color: rgba(255,255,255,.55); margin-bottom: 1.5rem;
  }
  .search-row { display: flex; gap: 10px; }
  .search-row input {
    flex: 1; padding: 14px 18px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; outline: none;
    transition: border-color .2s;
  }
  .search-row input::placeholder { color: rgba(255,255,255,.35); }
  .search-row input:focus { border-color: var(--cyan); }
  .run-btn {
    padding: 14px 28px;
    background: var(--blue); color: #fff; border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: opacity .15s, transform .1s;
  }
  .run-btn:hover { opacity: .88; }
  .run-btn:active { transform: scale(.98); }
  .run-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Progress */
  .progress-bar-wrap {
    height: 4px; background: var(--border);
    border-radius: 99px; overflow: hidden;
    margin-bottom: 1.5rem; opacity: 0; transition: opacity .3s;
  }
  .progress-bar-wrap.visible { opacity: 1; }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    border-radius: 99px; width: 0%; transition: width .5s ease;
  }
  .status-line {
    font-size: 15px; color: var(--muted);
    margin-bottom: 1.25rem; min-height: 22px;
    display: flex; align-items: center; gap: 8px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .65s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Section cards */
  .sections { display: flex; flex-direction: column; gap: 18px; }
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .section-card.visible { opacity: 1; transform: none; }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .section-icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .ic-industry { background: var(--blue-dim); }
  .ic-trends   { background: var(--cyan-dim); }
  .ic-audience { background: var(--green-dim); }
  .ic-local    { background: var(--amber-dim); }

  .section-label {
    font-size: 17px; font-weight: 700;
    color: var(--text); flex: 1;
  }
  .copy-btn {
    padding: 5px 14px; font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
    color: var(--muted); transition: background .15s;
  }
  .copy-btn:hover { background: var(--bg); }
  .copy-btn.copied { color: var(--success); border-color: #bbf7d0; }

  .section-body {
    padding: 20px 22px;
    font-size: 16px; line-height: 1.85;
    color: var(--text);
  }
  .section-body.waiting { color: var(--muted); font-style: italic; }

  /* Rendered content styles */
  .section-body h3 {
    font-size: 17px; font-weight: 700;
    color: var(--navy); margin: 1rem 0 .4rem;
  }
  .section-body ul { padding-left: 1.4rem; margin: .4rem 0; }
  .section-body li { margin-bottom: .35rem; }
  .section-body strong { font-weight: 700; color: var(--navy); }
  .section-body a {
    color: var(--blue); text-decoration: none; font-weight: 500;
  }
  .section-body a:hover { text-decoration: underline; }

  /* Chart container */
  .chart-wrap {
    padding: 20px 22px 10px;
    border-top: 1px solid var(--border);
  }
  .chart-title {
    font-size: 15px; font-weight: 700;
    color: var(--navy); margin-bottom: 14px;
  }
  .chart-canvas-wrap { position: relative; height: 220px; }

  /* Export */
  .export-row {
    display: flex; gap: 10px; margin-top: 1.25rem; flex-wrap: wrap;
  }
  .export-btn {
    padding: 11px 22px; font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    border: 1px solid var(--border); border-radius: 9px;
    cursor: pointer; background: var(--surface);
    color: var(--text); font-weight: 500;
    transition: background .15s;
  }
  .export-btn:hover { background: var(--bg); }
  .export-btn.primary {
    background: var(--navy); color: #fff;
    border-color: var(--navy);
  }
  .export-btn.primary:hover { opacity: .85; }

  .hidden { display: none !important; }

  .error-banner {
    background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 10px; padding: 14px 18px;
    font-size: 15px; color: #b91c1c; margin-bottom: 1rem;
  }

  footer {
    text-align: center; margin-top: 3.5rem;
    font-size: 14px; color: var(--muted);
  }
  footer a { color: var(--blue); text-decoration: none; font-weight: 500; }
  footer a:hover { text-decoration: underline; }
</style>
</head>

      <div class="chart-wrap hidden" id="chart-wrap-trends">
        <div class="chart-title">Keyword Interest Levels</div>
        <div class="chart-canvas-wrap"><canvas id="chart-trends"></canvas></div>
      </div>
    </div>

    <div class="section-card" id="card-audience">
      <div class="section-header">
        <div class="section-icon ic-audience">👥</div>
        <span class="section-label">Target Audience Insights</span>
        <button class="copy-btn" id="copy-audience" onclick="copySection('audience')">Copy</button>
      </div>
      <div class="section-body waiting" id="body-audience">Results will appear here...</div>
      <div class="chart-wrap hidden" id="chart-wrap-audience">
        <div class="chart-title">Audience Pain Points — Priority Score</div>
        <div class="chart-canvas-wrap"><canvas id="chart-audience"></canvas></div>
      </div>
    </div>

    <div class="section-card" id="card-local">
      <div class="section-header">
        <div class="section-icon ic-local">📍</div>
        <span class="section-label">Local Market Angle — NE Wisconsin</span>
        <button class="copy-btn" id="copy-local" onclick="copySection('local')">Copy</button>
      </div>
      <div class="section-body waiting" id="body-local">Results will appear here...</div>
      <div class="chart-wrap hidden" id="chart-wrap-local">
        <div class="chart-title">Local Opportunity Score by City</div>
        <div class="chart-canvas-wrap"><canvas id="chart-local"></canvas></div>
      </div>
    </div>
  </div>

  <div class="export-row hidden" id="exportRow">
    <button class="export-btn" onclick="copyAll()">📋 Copy full report</button>
    <button class="export-btn primary" onclick="downloadReport()">⬇ Download as .txt</button>
  </div>

  <footer>
    <a href="https://northstaraiautomation.com" target="_blank">northstaraiautomation.com</a>
    &nbsp;·&nbsp;
    <a href="https://northwisconsinbusiness.com" target="_blank">northwisconsinbusiness.com</a>
    &nbsp;·&nbsp; Two Rivers, WI
  </footer>

</div>

<script>
const API_URL = 'https://api.anthropic.com/v1/messages';
const sections = ['industry','trends','audience','local'];
const sectionData = {};
const chartData = {};
let apiKey = '';
let charts = {};

function handleKeyInput() {
  apiKey = document.getElementById('apiKeyInput').value.trim();
  document.getElementById('apiDot').classList.toggle('active', apiKey.length > 20);
}

const prompts = {
  industry: t => `You are a market research analyst. Research the industry for: "${t}".

Return ONLY a JSON object in this exact format, no other text:
{
  "bullets": [
    "Top competitors: ...",
    "Market size/growth: ...",
    "Main challenges: ...",
    "How businesses differentiate: ..."
  ],
  "links": [
    {"label": "Industry Association Name", "url": "https://..."},
    {"label": "Market Report Source", "url": "https://..."}
  ],
  "chart": {
    "labels": ["Competitor A", "Competitor B", "Competitor C", "Others"],
    "values": [35, 25, 20, 20]
  }
}`,

  trends: t => `You are a market research analyst. Research trending keywords for: "${t}".

Return ONLY a JSON object in this exact format, no other text:
{
  "keywords": ["keyword 1", "keyword 2", "keyword 3", "keyword 4", "keyword 5", "keyword 6"],
  "bullets": [
    "Emerging trend 1: ...",
    "Emerging trend 2: ...",
    "Popular content format: ..."
  ],
  "links": [
    {"label": "Google Trends", "url": "https://trends.google.com"},
    {"label": "Industry Blog or Resource", "url": "https://..."}
  ],
  "chart": {
    "labels": ["keyword 1", "keyword 2", "keyword 3", "keyword 4", "keyword 5", "keyword 6"],
    "values": [95, 82, 74, 68, 55, 44]
  }
}`,

  audience: t => `You are a market research analyst. Profile the target audience for: "${t}".

Return ONLY a JSON object in this exact format, no other text:
{
  "bullets": [
    "Demographics: ...",
    "Key pain points: ...",
    "How they find solutions: ...",
    "What they value in a provider: ..."
  ],
  "links": [
    {"label": "Relevant Association or Community", "url": "https://..."},
    {"label": "Industry Resource", "url": "https://..."}
  ],
  "chart": {
    "labels": ["Pain Point 1", "Pain Point 2", "Pain Point 3", "Pain Point 4"],
    "values": [90, 75, 65, 50]
  }
}`,

  local: t => `You are a market research analyst for Northeast Wisconsin (Two Rivers, Manitowoc, Sheboygan, Green Bay).

Research the local market for: "${t}".

Return ONLY a JSON object in this exact format, no other text:
{
  "bullets": [
    "Local competition: ...",
    "Regional economic factors: ...",
    "Difference from national trends: ...",
    "Opportunity for local provider: ..."
  ],
  "links": [
    {"label": "Manitowoc County Economic Development", "url": "https://www.co.manitowoc.wi.us"},
    {"label": "NEW North Regional Economy", "url": "https://www.newnorth.com"}
  ],
  "chart": {
    "labels": ["Two Rivers", "Manitowoc", "Sheboygan", "Green Bay"],
    "values": [72, 80, 65, 88]
  }
}`
};

const statusLabels = [
  'Analyzing industry landscape...',
  'Identifying trending keywords...',
  'Profiling target audience...',
  'Mapping local market opportunity...'
];

const sectionLabels = {
  industry: 'Industry & Competitor Overview',
  trends: 'Trending Topics & Keywords',
  audience: 'Target Audience Insights',
  local: 'Local Market Angle — NE Wisconsin'
};

const chartColors = ['#0038FF','#00C2FF','#0A0F2C','#6b7280','#93c5fd','#bfdbfe'];

function renderSection(s, data) {
  const body = document.getElementById('body-'+s);
  body.classList.remove('waiting');

  let html = '<ul>';
  (data.bullets || []).forEach(b => {
    const parts = b.split(':');
    if (parts.length > 1) {
      html += `<li><strong>${parts[0]}:</strong>${parts.slice(1).join(':')} </li>`;
    } else {
      html += `<li>${b}</li>`;
    }
  });
  html += '</ul>';

  if (data.keywords) {
    html += '<h3 style="margin-top:1rem;">Top Keywords</h3><ul>';
    data.keywords.forEach(k => { html += `<li>${k}</li>`; });
    html += '</ul>';
  }

  if (data.links && data.links.length) {
    html += '<h3 style="margin-top:1rem;">Useful Links</h3><ul>';
    data.links.forEach(l => {
      html += `<li><a href="${l.url}" target="_blank" rel="noopener">${l.label}</a></li>`;
    });
    html += '</ul>';
  }

  body.innerHTML = html;
  sectionData[s] = (data.bullets || []).join('\n') + (data.keywords ? '\nKeywords: ' + data.keywords.join(', ') : '');
}

function renderChart(s, data) {
  const wrap = document.getElementById('chart-wrap-'+s);
  wrap.classList.remove('hidden');

  if (charts[s]) { charts[s].destroy(); }

  const ctx = document.getElementById('chart-'+s).getContext('2d');
  const isBar = (s === 'trends' || s === 'audience' || s === 'local');

  chartData[s] = data.chart;

  charts[s] = new Chart(ctx, {
    type: isBar ? 'bar' : 'doughnut',
    data: {
      labels: data.chart.labels,
      datasets: [{
        data: data.chart.values,
        backgroundColor: chartColors.slice(0, data.chart.labels.length),
        borderWidth: isBar ? 0 : 2,
        borderColor: '#fff',
        borderRadius: isBar ? 6 : 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: isBar ? 'none' : 'right',
          labels: { font: { family: 'DM Sans', size: 13 }, padding: 16 }
        },
        tooltip: {
          callbacks: {
            label: ctx => isBar ? ` ${ctx.raw}` : ` ${ctx.raw}%`
          }
        }
      },
      scales: isBar ? {
        x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 12 } } },
        y: { grid: { color: '#f0f2f7' }, ticks: { font: { family: 'DM Sans', size: 12 } } }
      } : {}
    }
  });
}

async function runResearch() {
  const topic = document.getElementById('topicInput').value.trim();
  const errorBanner = document.getElementById('errorBanner');
  errorBanner.classList.add('hidden');

  if (!topic) { showError('Please enter a research topic.'); return; }
  if (!apiKey) { showError('Please paste your Anthropic API key in the top-right field.'); return; }

  const btn = document.getElementById('runBtn');
  btn.disabled = true;

  sections.forEach(s => {
    sectionData[s] = '';
    const body = document.getElementById('body-'+s);
    body.innerHTML = 'Researching...';
    body.classList.add('waiting');
    document.getElementById('card-'+s).classList.remove('visible');
    document.getElementById('copy-'+s).textContent = 'Copy';
    document.getElementById('copy-'+s).classList.remove('copied');
    document.getElementById('chart-wrap-'+s).classList.add('hidden');
  });
  document.getElementById('exportRow').classList.add('hidden');

  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  progressWrap.classList.add('visible');
  progressBar.style.width = '5%';

  for (let i = 0; i < sections.length; i++) {
    const s = sections[i];
    setStatus(statusLabels[i]);
    progressBar.style.width = (10 + i * 22) + '%';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 800,
          messages: [{ role: 'user', content: prompts[s](topic) }]
        })
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error.message);

      let text = result.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
      text = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(text);

      renderSection(s, parsed);
      renderChart(s, parsed);
    } catch(e) {
      const body = document.getElementById('body-'+s);
      body.classList.remove('waiting');
      body.textContent = 'Error: ' + e.message;
      sectionData[s] = 'Error';
    }

    document.getElementById('card-'+s).classList.add('visible');
  }

  progressBar.style.width = '100%';
  setStatus('✓ Research complete.', true);
  document.getElementById('exportRow').classList.remove('hidden');
  btn.disabled = false;
  setTimeout(() => { progressWrap.classList.remove('visible'); }, 1000);
}

function setStatus(msg, done=false) {
  const el = document.getElementById('statusLine');
  el.innerHTML = done
    ? `<span style="color:var(--success);font-weight:600;">${msg}</span>`
    : `<div class="spinner"></div><span>${msg}</span>`;
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = msg; el.classList.remove('hidden');
}

function copySection(s) {
  if (!sectionData[s]) return;
  navigator.clipboard.writeText(sectionData[s]).then(() => {
    const btn = document.getElementById('copy-'+s);
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyAll() {
  const topic = document.getElementById('topicInput').value.trim();
  const lines = ['MARKET RESEARCH REPORT', 'Topic: ' + topic, 'Northstar AI Automation — northstaraiautomation.com', '='.repeat(50), ''];
  sections.forEach(s => {
    lines.push('## ' + sectionLabels[s]);
    lines.push('');
    lines.push(sectionData[s] || '');
    lines.push(''); lines.push('-'.repeat(50)); lines.push('');
  });
  navigator.clipboard.writeText(lines.join('\n'));
}

function downloadReport() {
  const topic = document.getElementById('topicInput').value.trim();
  const lines = ['MARKET RESEARCH REPORT', 'Topic: ' + topic, 'Northstar AI Automation', 'northstaraiautomation.com | northwisconsinbusiness.com', '='.repeat(50), ''];
  sections.forEach(s => {
    lines.push('## ' + sectionLabels[s]);
    lines.push('');
    lines.push(sectionData[s] || '');
    lines.push(''); lines.push('-'.repeat(50)); lines.push('');
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'market-research-' + topic.replace(/\s+/g,'-').toLowerCase().slice(0,40) + '.txt';
  a.click();
}

document.getElementById('topicInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runResearch();
});
</script>
</body>
</html>
